name: wardrobe_matcher
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.12.0+1
  image_picker: ^1.2.2
  url_launcher: ^6.3.2
  cupertino_icons: ^1.0.8
  screenshot: ^3.0.0
  gal: ^2.3.2
  path_provider: ^2.1.5
  google_mlkit_subject_segmentation: ^0.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:

  uses-material-design: true

flutter_launcher_icons:
     android: "launcher_icon"
     ios: true
     image_path: "assets/icon.png"
     min_sdk_android: 21
